name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@latest
      - name: Verify release tag
        run: |
          node --input-type=module --eval '
            import packageJson from "./package.json" with { type: "json" };
            const expected = `v${packageJson.version}`;
            if (process.env.GITHUB_REF_NAME !== expected) {
              throw new Error(`Expected tag ${expected}, received ${process.env.GITHUB_REF_NAME}`);
            }
          '
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
