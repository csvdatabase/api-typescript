name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@latest
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
        run: |
          node --input-type=module --eval '
            import packageJson from "./package.json" with { type: "json" };
            const tag = process.env.RELEASE_TAG ?? "";
            const target = process.env.TARGET_COMMITISH ?? "";
            const match = tag.match(/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/);
            if (!match) throw new Error(`Release tag must look like v1.1.1, received ${tag}`);
            const expected = `v${packageJson.version}`;
            if (tag !== expected) {
              throw new Error(`Expected tag ${expected}, received ${tag}`);
            }
            if (match[2] === "0" && match[3] === "0" && target !== `v${match[1]}`) {
              throw new Error(`Major release ${tag} must target branch v${match[1]}, received ${target}`);
            }
          '
      - run: npm ci
      - run: npm run check
      - run: npm publish --access public --provenance
